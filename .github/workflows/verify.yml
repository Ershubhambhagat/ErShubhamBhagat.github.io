name: Verify

# Why this workflow exists: the audit found no automated gate at all, and the
# first version of this file gated only `gh-pages` while the work happened on
# `New_Version` - so a push of the actual code ran no check (quality audit C1).
#
# Why the automatic triggers are off (2026-11-28): the owner asked for the running
# verification to be paused. The job itself is kept, intact, behind a manual trigger:
# nothing runs on push or pull request, so a branch is never blocked by this workflow.
#
# The failure that prompted the pause was the bookmark check in
# `scripts/validate-data.mjs`: it required the legacy folders (Project/, BookMark/,
# Future/, CSSEditer/, CodeSnippet/, Sangrampur/) to exist, but those are git-ignored,
# so no CI runner could ever have them. That check now distinguishes a dead link from a
# folder absent from the checkout, so the job passes on a fresh clone. Re-enabling is
# therefore one line: put `push:` and `pull_request:` back under `on:`.
#
# The same gates still run in .github/workflows/deploy.yml before a publish, so a
# deployment cannot ship data that fails validation.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate datasets
        run: node scripts/validate-data.mjs

      - name: Check the module contract
        run: node scripts/check-modules.mjs

      - name: Run unit tests
        run: node tests/run.mjs

      - name: Check the first-load budget
        # docs/DEVELOPMENT/PERFORMANCE.md holds the limits; this step is what makes
        # them a gate instead of a table (SEO-007).
        run: node scripts/check-budget.mjs

      - name: Check that no module claims a placeholder it no longer is
        # Comments must match the code (DEVELOPER_FRIENDLY_CODE_COMMENTS.md).
        # The audit found four modules still describing themselves as
        # placeholders after they were implemented, so the rule is now enforced
        # instead of remembered.
        run: |
          if grep -rn --include="*.js" --include="*.css" -i "placeholder in this build\|not implemented yet\|coming soon" js css index.html; then
            echo "::error::A source comment claims a feature is still a placeholder."
            exit 1
          fi
          echo "Comment freshness check passed."
