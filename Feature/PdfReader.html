<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PDF Viewer Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }

    .light-mode {
      background: #f5f5f5;
      color: #333;
    }

    .dark-mode {
      background: #121212;
      color: #f5f5f5;
    }

    .toggle-btn {
      margin-bottom: 20px;
     -color: #007bff;
      color: white;
      border-radius: 5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: inherit;
      border: 1px solid #ccc;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.02);
    }

    .card-title {
      font-weight: bold;
      margin-bottom: 10px;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
<body class="light-mode">
  <button class="toggle-btn" onclick="toggleTheme()">Toggle Dark/Light Mode</button>
  <div class="grid" id="pdfGrid"></div>
  <div id="pdfViewer"></div>

  <script>
    const repoOwner = "Ershubhambhagat";
    const repoName = "Share";
    const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents`;

    const grid = document.getElementById("pdfGrid");
    const viewer = document.getElementById("pdfViewer");

    async function fetchPDFs() {
      try {
        const response = await fetch(apiURL);
        const files = await response.json();

        const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith(".pdf"));

        pdfFiles.forEach(file => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-title">${file.name.replace(".pdf", "")}</div>
            <button onclick="viewPDF('${file.download_url}')">View PDF</button>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error("Error fetching PDFs:", error);
        grid.innerHTML = "<p>Failed to load PDFs. Please check the repository or try again later.</p>";
      }
    }

    function viewPDF(url) {
      viewer.innerHTML = `<iframe src="${url}"></iframe>`;
    }

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      document.body.classList.toggle("light-mode");
    }

    fetchPDFs();
  </script>
</body>
</html>
