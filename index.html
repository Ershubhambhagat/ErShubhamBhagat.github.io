<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--
      Viewport: no maximum-scale or user-scalable restriction. Zoom must stay
      available for low-vision visitors, so only the initial scale is declared.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--
      NAME CONFLICT (inherited, not resolved here):
      .build/FACTS.md records two attested brand names - the visible page name
      "Shubham Kumar" (index_old.html:65) and the title/handle form
      "Er Shubham Bhagat" (index_old.html:8). This shell uses the title/handle
      form because it matches the canonical URL and every social handle.
      The SEO phase (js/features/seo.js) and the owner may replace the title and
      description; nothing else in the app reads them.
    -->
    <meta
        name="description"
        content="Personal portfolio of Er Shubham Bhagat - designer and developer from Bihar, India. Profile, skills, projects, certificates, learning journey and contact."
    >

    <!--
      theme-color is the dark-first page background (#08090c = the
      --color-background value in css/variables.css), so mobile browser chrome
      blends into the page instead of banding above it. It is a literal because
      this meta cannot read a custom property.

      Limitation, stated rather than hidden: Theme Studio can repaint the page at
      runtime but cannot rewrite this meta, and a single meta cannot follow both
      themes. The SEO phase may add a media="(prefers-color-scheme: light)"
      variant for the system-light case; nothing else should depend on the value.
    -->
    <meta name="theme-color" content="#08090c">

    <!--
      Dark-first palette: declaring the supported schemes here stops the browser
      from painting white native controls (scrollbars, form widgets) before
      css/variables.css loads. css/variables.css owns the authoritative
      color-scheme per theme; this meta is only the pre-CSS hint. It also keeps
      the first paint dark, which is why <html> carries no data-theme attribute:
      :root in css/variables.css is already the dark theme, and Theme Studio adds
      data-theme only when a visitor leaves the default.
    -->
    <meta name="color-scheme" content="dark light">

    <title>Er Shubham Bhagat &middot; Portfolio</title>

    <!--
      Canonical is the user-site root: this repository is
      ErShubhamBhagat.github.io and GitHub Pages lowercases the host, so
      https://ershubhambhagat.github.io/ is the one address that serves this file.
      The SEO phase owns richer metadata (Open Graph, JSON-LD) and may extend
      this block; it must not change the URL shape.
    -->
    <link rel="canonical" href="https://ershubhambhagat.github.io/">

    <!--
      Favicon is a single hand-authored SVG (assets/images/favicon.svg) linked
      inline in the head, so no extra HTTP request is needed for a PNG set and
      the mark stays sharp at every size. Browsers without SVG favicon support
      fall back to their default icon - harmless, and the mark is not needed to
      use the page.
    -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">

    <!--
      STYLESHEET LOAD ORDER - do not shuffle, later layers depend on earlier ones.

      1. Global layer. css/variables.css must stay first: every other file
         consumes its custom properties, and Theme Studio works only by
         overriding them on :root.
      2. Layout layer: the shell regions declared in the body below.
      3. Component layer: shared UI reused by several sections.
      4. Section layer: loaded last so a section can refine shared component
         styling without escalating selector specificity.

      This file only links these stylesheets. Every path below is owned by
      another phase; a missing file means that phase has not run yet, not that
      the link is wrong.
    -->

    <!-- Global layer -->
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/animations.css">

    <!-- Layout layer: header, footer, navigation -->
    <link rel="stylesheet" href="./css/layout/header.css">
    <link rel="stylesheet" href="./css/layout/footer.css">
    <link rel="stylesheet" href="./css/layout/navigation.css">

    <!-- Component layer: shared, section-agnostic UI -->
    <link rel="stylesheet" href="./css/components/buttons.css">
    <link rel="stylesheet" href="./css/components/cards.css">
    <link rel="stylesheet" href="./css/components/badges.css">
    <link rel="stylesheet" href="./css/components/modals.css">
    <link rel="stylesheet" href="./css/components/search.css">
    <link rel="stylesheet" href="./css/components/filters.css">
    <link rel="stylesheet" href="./css/components/timeline.css">
    <link rel="stylesheet" href="./css/components/tooltips.css">
    <link rel="stylesheet" href="./css/components/toast.css">

    <!--
      Section layer, in the pinned section order, followed by the three
      cross-section feature stylesheets. Global Search, Theme Studio and the
      JSON Manager are features rather than sections, but their CSS paths live
      under css/sections/ by contract and their modules expect to be linked
      from here - so they are loaded in the same layer.
    -->
    <link rel="stylesheet" href="./css/sections/profile.css">
    <link rel="stylesheet" href="./css/sections/skills.css">
    <link rel="stylesheet" href="./css/sections/experience.css">
    <link rel="stylesheet" href="./css/sections/projects.css">
    <link rel="stylesheet" href="./css/sections/certificates.css">
    <link rel="stylesheet" href="./css/sections/education.css">
    <link rel="stylesheet" href="./css/sections/learning-journey.css">
    <link rel="stylesheet" href="./css/sections/career-timeline.css">
    <link rel="stylesheet" href="./css/sections/github-importer.css">
    <link rel="stylesheet" href="./css/sections/bookmarks.css">
    <link rel="stylesheet" href="./css/sections/contact.css">
    <link rel="stylesheet" href="./css/sections/global-search.css">
    <link rel="stylesheet" href="./css/sections/theme-studio.css">
    <link rel="stylesheet" href="./css/sections/json-manager.css">
</head>

<body>

<!--
  NO-JAVASCRIPT FALLBACK

  Every section is rendered from data/*.json by js/app.js, so with scripting
  disabled the page would be an empty shell. This notice sits at the top of the
  body - before any region a script would fill - so a visitor without JS sees an
  explanation instead of a blank page. It is the only place in this file that
  offers a direct contact route, deliberately without an email address: the
  address is obfuscated in the old page and not yet confirmed
  (.build/FACTS.md, "Email").
-->
<noscript>
    <div class="noscript-notice" role="status">
        <p>
            <strong>JavaScript is switched off.</strong>
            This portfolio builds its sections from JSON data in the browser, so
            the content cannot be displayed. Please enable JavaScript and reload
            the page, or reach me through my
            <a href="https://github.com/ershubhambhagat" target="_blank" rel="noopener noreferrer">GitHub profile</a>.
        </p>
    </div>
</noscript>

<!--
  SKIP LINK

  First focusable element on the page and visually hidden until focused
  (.skip-link lives in css/main.css). It targets #main-content, which is
  focusable via tabindex="-1" below so the browser actually moves focus into the
  content instead of only scrolling.
-->
<a class="skip-link" href="#main-content">Skip to main content</a>

<!--
  APPLICATION HEADER - contract mount point #site-header

  js/core/navigation.js (Navigation and Layout phase) renders the desktop
  navigation into nav#site-navigation from data/navigation.json, fills in the
  brand link below from the same file, and owns button#mobile-menu-toggle: its
  aria-expanded state, its aria-controls target, focus handling, the open/close
  behaviour and the sticky/elevated state.

  The pinned ids (.build/CONTRACT.md) must not be renamed, moved into a section
  or duplicated: Global Search, Theme Studio and the mobile panel all resolve
  these nodes by id. The header carries no navigation links in markup on
  purpose - the list is data, not markup.

  SOURCE ORDER OF THE TOGGLE AND THE NAV IS DELIBERATE. Both are siblings in one
  flex row, and css/layout/header.css uses `order` to lay them out visually
  (brand, nav, toggle on desktop). In source order the toggle comes first so that
  Tab moves from the button straight into the panel it just opened; with the nav
  first, the next Tab after opening the menu would skip the whole menu. Do not
  swap the two elements to change the visual order - change `order` instead.
-->
<header id="site-header" class="site-header">
    <!--
      Brand. Label and href are replaced from data/navigation.json at runtime;
      the text here is the pre-JavaScript fallback and matches the canonical
      name already used in <title> and the meta description. It is an anchor,
      not a button, because it navigates to an in-page section.
    -->
    <a class="site-brand" href="#profile">
        <span class="site-brand__label">Er Shubham Bhagat</span>
    </a>

    <!--
      Real button, not a div: it must be reachable and activatable from the
      keyboard. The accessible name is on the button and the three bars drawn
      by CSS (one element plus its two pseudo-elements) are decorative.
      aria-controls points at #site-navigation because that is the element the
      toggle opens; the specification's example name (mobile-navigation) does
      not exist in this shell and would dangle.

      aria-expanded starts at "false" and is kept truthful by
      js/core/navigation.js - the CSS open state is driven by the header class
      that the same module sets, so the visual state can never disagree with the
      announced state.
    -->
    <button
        type="button"
        id="mobile-menu-toggle"
        aria-expanded="false"
        aria-controls="site-navigation"
        aria-label="Open navigation menu"
    >
        <span aria-hidden="true"></span>
    </button>

    <nav id="site-navigation" aria-label="Main navigation">
        <!-- Navigation items are rendered from data/navigation.json. -->
    </nav>
</header>

<!--
  PORTFOLIO CONTENT - contract mount point #main-content

  The eleven <section> elements below are empty on purpose: each section module
  in js/sections/ renders its own content into its element and is responsible
  for its own <h2>. The order and the ids are pinned by .build/CONTRACT.md and
  three consumers depend on them:

    - data/navigation.json targets these ids as hash links (#projects, ...);
    - Global Search maps every result to one of these ids and scrolls to it;
    - Career Timeline resolves referenceId values to records rendered here.

  Renaming or reordering these ids silently breaks all three. Do not add a
  duplicate id and do not nest one section inside another.
-->
<main id="main-content" tabindex="-1">
    <section id="profile"></section>
    <section id="skills"></section>
    <section id="experience"></section>
    <section id="projects"></section>
    <section id="certificates"></section>
    <section id="education"></section>
    <section id="learning-journey"></section>
    <section id="career-timeline"></section>
    <section id="github-importer"></section>
    <section id="bookmarks"></section>
    <section id="contact"></section>
</main>

<!--
  APPLICATION FOOTER - contract mount point #site-footer

  Filled by the Navigation and Layout phase with contact and social links taken
  from the data files, so the footer never hardcodes a repeated record.
-->
<footer id="site-footer"></footer>

<!--
  BACK TO TOP - contract mount point #back-to-top

  Starts hidden: an empty page needs no "scroll up" affordance, and the button is
  only meaningful after js/core/navigation.js has attached its behaviour. That
  module removes the `hidden` attribute once the page can scroll.

  The arrow is inline SVG so it inherits `currentColor` from the button and needs
  no icon font or extra request. Layout CSS must not force `display` on this
  element in a way that overrides [hidden], or it would show before it works.
-->
<button id="back-to-top" type="button" aria-label="Back to top" hidden>
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path
            d="M12 19V5M5 12l7-7 7 7"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    </svg>
</button>

<!--
  CROSS-SECTION FEATURE MOUNTS - contract mount points

    #global-search-root -> js/features/global-search.js
    #theme-studio-root  -> js/features/theme-studio.js
    #json-manager-root  -> js/features/json-manager.js

  Each feature renders its own panel or drawer inside its mount, so a feature can
  be disabled in js/config.js without leaving orphan UI behind. Keep these
  siblings of <main>, not children of it: they are application chrome, and they
  must stay out of the document outline that the section headings build.
-->
<div id="global-search-root"></div>
<div id="theme-studio-root"></div>
<div id="json-manager-root"></div>

<!--
  MODAL AND TOAST PORTS - contract mount points

  #modal-root is the only allowed parent for modals (js/core/modal-manager.js
  renders into it, sets role="dialog" and manages the focus trap). aria-live is
  polite so a modal that replaces the page focus announces itself without
  interrupting whatever a screen reader is currently reading.

  #toast-root is assertive-by-composition: polite plus aria-atomic so the whole
  message is read once, rather than each span being announced separately.
  js/components/toast.js degrades gracefully if this element is missing, but it
  is present here, so toasts never fall back to an alert().
-->
<div id="modal-root" aria-live="polite"></div>
<div id="toast-root" aria-live="polite" aria-atomic="true"></div>

<!--
  APPLICATION ENTRY POINT

  One module, loaded as an ES module (no bundler, no build step). app.js owns the
  initialization order and every section and feature import; nothing else in
  this file runs script, and no inline script is used, so a strict
  Content-Security-Policy added later will not need unsafe-inline for the shell.
-->
<script type="module" src="./js/app.js"></script>

</body>
</html>
